services:
  adria-db:
    image: mysql:latest
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: # fill in variable
      MYSQL_DATABASE: # fill in variable
      MYSQL_USER: # fill in variable
      MYSQL_PASSWORD: # fill in variable
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
